name: Skill checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline helper tests
        run: python -m unittest discover -s scripts -v
      - name: Check command-line help
        run: python scripts/openalex.py --help
      - name: Build installation archive
        run: python scripts/package_skill.py
      - name: Verify archive integrity
        run: python -m zipfile -t dist/abc-research-generator-v1.0.0.zip
